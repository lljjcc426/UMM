name: Validate research repository

on:
  push:
    branches:
      - main
      - 'research/**'
      - 'feat/**'
      - 'fix/**'
      - 'exp/**'
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'data/**'
      - 'configs/research/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'data/**'
      - 'configs/research/**'
      - 'templates/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up isolated test runtime
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate full repository, research v1 and v2
        run: |
          .venv-ci/bin/python scripts/validate_catalog.py
          .venv-ci/bin/python scripts/validate_research_plan.py --output reports/research_plan_v1_validation.json
          .venv-ci/bin/python scripts/validate_research_v2.py --output reports/research_plan_v2_validation.json
      - name: Validate stage manifest in draft or candidate state
        run: .venv-ci/bin/python scripts/validate_stage_release.py
      - name: Run full regression tests
        run: .venv-ci/bin/python -m unittest discover -s tests -v
      - name: Require approved evidence for research PR into main
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'research/')
        run: .venv-ci/bin/python scripts/validate_stage_release.py --require-ready
